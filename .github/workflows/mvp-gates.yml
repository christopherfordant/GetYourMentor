name: GetYourMentor MVP gates

on:
  push:
    branches: [feat/nextjs-migration, main]
  pull_request:
    branches: [feat/nextjs-migration, main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, audit and Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-next

    env:
      PAYMENT_PROVIDER: local
      STRIPE_WEBHOOK_SECRET: test-webhook-secret
      GETYOURMENTOR_ALLOW_DEMO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify preproduction environment template
        run: npm run check:preproduction-template

      - name: Verify Supabase application schema
        run: npm run check:supabase-schema

      - name: Verify production configuration gate
        run: |
          set +e
          npm run check:production-config
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "The production configuration gate unexpectedly passed without complete configuration."
            exit 1
          fi
          echo "Incomplete production configuration was rejected as expected."

      - name: Reject demo and acceptance modes in production
        run: |
          set +e
          npm run check:production-config
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Production configuration unexpectedly accepted test-only modes."
            exit 1
          fi
          echo "Test-only modes were rejected in production as expected."
        env:
          NODE_ENV: production
          GETYOURMENTOR_ALLOW_DEMO: true
          GETYOURMENTOR_ACCEPTANCE_MODE: true

      - name: Verify complete production configuration
        run: npm run check:production-config
        env:
          SUPABASE_URL: "https://demo-project.supabase.co"
          SUPABASE_ANON_KEY: "anon-demo"
          SUPABASE_SERVICE_ROLE_KEY: "service-demo"
          SESSION_SECRET: "01234567890123456789012345678901"
          NEXT_PUBLIC_APP_URL: "https://preprod.example.com"
          PAYMENT_PROVIDER: "stripe"
          STRIPE_SECRET_KEY: "sk_test_demo"
          STRIPE_WEBHOOK_SECRET: "whsec_demo"
          RESEND_API_KEY: "re_demo"
          RESEND_FROM_EMAIL: "noreply@example.com"

      - name: Build production bundle
        run: npm run build

      - name: Verify production fail-closed behavior
        run: npm run check:production-safety

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run acceptance suite
        # Le backend de démonstration partage un store mémoire entre les scénarios.
        # Garder un worker unique rend la validation CI déterministe, comme en local.
        run: npx playwright test --reporter=line --workers=1
