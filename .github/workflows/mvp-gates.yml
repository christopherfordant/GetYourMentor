name: GetYourMentor MVP gates

on:
  workflow_dispatch:
  push:
    branches: [feat/nextjs-migration, main]
  pull_request:
    branches: [feat/nextjs-migration, main, feat/visual-contract-next-step]

permissions:
  contents: read

jobs:
  validate:
    name: Build, audit and Playwright
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gym-next

    env:
      PAYMENT_PROVIDER: local
      STRIPE_WEBHOOK_SECRET: test-webhook-secret
      GETYOURMENTOR_ALLOW_DEMO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check:types

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify preproduction environment template
        run: npm run check:preproduction-template

      - name: Verify tracked secrets
        run: npm run check:tracked-secrets

      - name: Verify Netlify deployment contract
        run: npm run check:netlify-config

      - name: Verify n8n workflow exports
        run: npm run check:n8n-workflows

      - name: Verify Supabase application schema
        run: npm run check:supabase-schema

      - name: Verify production configuration gate
        run: |
          set +e
          npm run check:production-config
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "The production configuration gate unexpectedly passed without complete configuration."
            exit 1
          fi
          echo "Incomplete production configuration was rejected as expected."

      - name: Reject demo and acceptance modes in production
        run: |
          set +e
          npm run check:production-config
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Production configuration unexpectedly accepted test-only modes."
            exit 1
          fi
          echo "Test-only modes were rejected in production as expected."
        env:
          NODE_ENV: production
          GETYOURMENTOR_ALLOW_DEMO: true
          GETYOURMENTOR_ACCEPTANCE_MODE: true

      - name: Build production bundle
        run: npm run build

      - name: Verify client/server secret boundary
        run: npm run check:client-secret-boundary

      - name: Verify production fail-closed behavior
        run: npm run check:production-safety

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run acceptance suite
        # Le backend de démonstration partage un store mémoire entre les scénarios.
        # Garder un worker unique rend la validation CI déterministe, comme en local.
        run: npx playwright test --reporter=line --workers=1

  production-readiness:
    name: Production readiness (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gym-next
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      LEGAL_ENTITY_NAME: ${{ secrets.LEGAL_ENTITY_NAME }}
      LEGAL_ENTITY_ADDRESS: ${{ secrets.LEGAL_ENTITY_ADDRESS }}
      LEGAL_CONTACT_EMAIL: ${{ secrets.LEGAL_CONTACT_EMAIL }}
      LEGAL_REGISTRATION: ${{ secrets.LEGAL_REGISTRATION }}
      LEGAL_DIRECTOR_NAME: ${{ secrets.LEGAL_DIRECTOR_NAME }}
      LEGAL_CONTENT_APPROVED: ${{ secrets.LEGAL_CONTENT_APPROVED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify complete production configuration
        run: npm run check:production-config
