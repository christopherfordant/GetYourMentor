services:
  - type: web
    name: getyourmentor-web
    runtime: node
    region: frankfurt
    plan: free
    rootDir: gym-next
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEPLOY_ENV
        value: staging
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: LEGAL_ENTITY_ADDRESS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_REGISTRATION
        sync: false
      - key: LEGAL_DIRECTOR_NAME
        sync: false
      - key: LEGAL_CONTENT_APPROVED
        value: "false"
