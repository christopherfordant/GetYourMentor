<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GetYourMentor — ouverture de page en deux battants</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#fcfbf9;font:15px/1.5 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:22px 20px}h1{font-size:clamp(22px,3vw,32px);margin:0 0 6px;letter-spacing:-.03em}p{margin:6px 0;color:#c9c9cc}.eyebrow{color:#ff8a4c;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0}button,select{min-height:44px;border:1px solid #777;border-radius:8px;padding:10px 15px;color:#fcfbf9;background:#242424;font:inherit;cursor:pointer}#play{background:#c2410c;border-color:#ff8a4c}button[aria-disabled=true]{opacity:.5;cursor:wait}:is(button,select):focus-visible{outline:3px solid #ff8a4c;outline-offset:3px}label{display:flex;align-items:center;gap:8px}.hint{font-size:12px}.stage{position:relative;width:min(1200px,calc((100svh - 250px)*1.6));max-width:100%;aspect-ratio:8/5;overflow:hidden;margin:16px auto 0;background:#141414;border:1px solid #4a4a4a;border-radius:12px;perspective:3000px;isolation:isolate}.incoming{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;transform-origin:center;will-change:transform,filter}.door{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;will-change:transform;z-index:2}.left{left:0;transform-origin:left center}.right{right:0;transform-origin:right center}.face,.back{position:absolute;inset:0;backface-visibility:hidden}.face{background-image:var(--from);background-size:200% 100%;background-repeat:no-repeat;transform:translateZ(1px)}.left .face{background-position:left top;border-right:1px solid rgba(255,255,255,.12)}.right .face{background-position:right top;border-left:1px solid rgba(255,255,255,.12)}.back{background:linear-gradient(120deg,#28201b,#141414 70%);border:1px solid #6d5545;transform:rotateY(180deg) translateZ(5px)}.back::after{content:"GYM ↗";display:grid;place-items:center;height:100%;color:#ff8a4c;font-size:clamp(20px,5vw,58px);font-weight:800;opacity:.28}.stage::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 45px #0004;pointer-events:none;z-index:3}#status{min-height:22px}.badge{display:block;text-align:center;color:#a1a1aa;font-size:12px;margin-top:9px}#preference{color:#e9b794;font-size:12px}
@media(max-width:600px){main{padding:16px 12px}.controls{gap:8px;margin:12px 0}button,select{font-size:12px;padding:9px 11px}.stage{aspect-ratio:1/2;width:min(390px,calc((100svh - 300px)*.5));min-width:180px;margin-top:12px}.hint{font-size:11px}}
</style></head><body><main>
<p class="eyebrow">GetYourMentor · essai de transition</p><h1>Une page qui s’ouvre comme une porte.</h1>
<p class="hint">Deux battants s’ouvrent vers l’extérieur. La prochaine page apparaît derrière et avance au premier plan.</p>
<div class="controls"><button type="button" id="play" aria-disabled="true">Voir l’ouverture 3D</button><button type="button" id="replay" aria-disabled="true">Rejouer</button><button type="button" id="instant" aria-disabled="true">Changer sans animation</button><label>Vitesse <select id="speed"><option value="950">Normale</option><option value="2200">Ralenti</option></select></label></div>
<p id="preference"></p><p id="status" role="status" aria-live="polite">Chargement des captures…</p>
<div id="stage" class="stage" data-state="loading" data-page="accueil" role="img" aria-label="Capture de l’accueil GetYourMentor">
<div class="incoming" aria-hidden="true"></div><div class="door left" aria-hidden="true"><div class="face"></div><div class="back"></div></div><div class="door right" aria-hidden="true"><div class="face"></div><div class="back"></div></div></div>
<small class="badge">Aperçu avec des captures locales · la navigation réelle du site reste inchangée.</small>
</main><script>
const stage=document.getElementById('stage'),incoming=stage.querySelector('.incoming');
const doors=[...stage.querySelectorAll('.door')],faces=[...stage.querySelectorAll('.face')];
const status=document.getElementById('status'),buttons=[...document.querySelectorAll('button')];
const names=['accueil','annuaire'];
let ready=false,busy=false,current=0,destination=0,animations=[],sequence=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
document.getElementById('preference').textContent=reduced.matches?'Ton appareil réduit les mouvements. Le bouton 3D active cet effet uniquement pour cette démonstration.':'L’animation se lance uniquement à ta demande. Échap permet de la terminer immédiatement.';
function path(index){return `${names[index]}-${matchMedia('(max-width:600px)').matches?'mobile':'desktop'}.webp`}
function availability(){buttons.forEach(button=>button.setAttribute('aria-disabled',String(!ready||busy)))}
function show(index){
  incoming.style.backgroundImage=`url("${path(index)}")`;
  incoming.style.transform='none';incoming.style.filter='none';
  stage.style.perspective=`${stage.clientWidth*3.2}px`;
  doors.forEach(door=>{door.style.visibility='hidden';door.style.transform='none'});
  stage.dataset.page=names[index];stage.dataset.state='idle';
  stage.setAttribute('aria-label',`Capture de la page ${names[index]} GetYourMentor`);
  status.textContent=`${index===0?'Accueil':'Annuaire'} affiché — aperçu.`;
}
function finish(){
  if(!busy)return;
  busy=false;animations.forEach(animation=>animation.cancel());animations=[];
  current=destination;show(current);availability();
}
async function open({replay=false,instant=false}={}){
  if(!ready||busy)return;
  const run=++sequence;
  const from=replay?0:current,to=replay?1:1-current;
  destination=to;busy=true;availability();
  if(instant||typeof stage.animate!=='function'){finish();return}
  stage.style.setProperty('--from',`url("${path(from)}")`);
  incoming.style.backgroundImage=`url("${path(to)}")`;
  doors.forEach(door=>{door.style.visibility='visible';door.style.transform='none'});
  stage.style.perspective=`${stage.clientWidth*3.2}px`;
  stage.dataset.state='opening';status.textContent='Ouverture des deux battants…';
  const duration=Number(document.getElementById('speed').value),easing='cubic-bezier(.22,.75,.2,1)';
  animations=[
    doors[0].animate([{transform:'rotateY(0deg)'},{transform:'rotateY(-110deg)'}],{duration,easing,fill:'both'}),
    doors[1].animate([{transform:'rotateY(0deg)'},{transform:'rotateY(110deg)'}],{duration,easing,fill:'both'}),
    incoming.animate([{transform:'translateZ(-220px) scale(.88)',filter:'brightness(.65)'},{transform:'translateZ(0px) scale(1)',filter:'brightness(1)'}],{duration,easing,fill:'both'}),
    ...faces.map(face=>face.animate([{filter:'brightness(1)'},{filter:'brightness(.65)'}],{duration,easing,fill:'both'}))
  ];
  await Promise.allSettled(animations.map(animation=>animation.finished));
  if(run===sequence)finish();
}
document.getElementById('play').addEventListener('click',()=>open());
document.getElementById('replay').addEventListener('click',()=>open({replay:true}));
document.getElementById('instant').addEventListener('click',()=>open({instant:true}));
addEventListener('keydown',event=>{if(event.key==='Escape')finish()});
addEventListener('resize',()=>{if(busy)finish();if(ready)show(current)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)finish()});
reduced.addEventListener('change',()=>{if(reduced.matches)finish()});
const captures=names.flatMap(name=>['desktop','mobile'].map(size=>`${name}-${size}.webp`));
Promise.all(captures.map(src=>{const image=new Image();image.src=src;return image.decode()})).then(()=>{
  ready=true;show(0);availability();
}).catch(()=>{stage.dataset.state='error';status.textContent='Captures indisponibles. Conserve ce fichier avec ses quatre images dans le même dossier.'});
</script></body></html>
